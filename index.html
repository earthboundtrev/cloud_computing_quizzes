<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1419">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Study Sessions – Practice Quizzes</title>
  <link rel="stylesheet" href="css/quiz-common.css?v=5">
  <style>
    :root {
      --oci: #f97316;
      --gcp: #4285f4;
      --azure: #0078d4;
      --aws: #ff9900;
      --terraform: #7B42BC;
      --cissp: #0066cc;
      --secai: #c41e3a;
      --redhat: #ee0000;
    }
    .quiz-list { display: flex; flex-direction: column; gap: 1rem; }
    a.quiz-card {
      display: block;
      background: var(--surface);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: var(--text);
      border-left: 4px solid var(--accent);
      /* Only transition background here — transform transitions on tiles break
         SortableJS touch drags on mobile (see SortableJS/Sortable#2426). */
      transition: background 0.15s;
      -webkit-user-drag: none;
    }
    @media (hover: hover) and (pointer: fine) {
      a.quiz-card {
        transition: background 0.15s, transform 0.1s;
      }
      a.quiz-card:hover {
        background: #151d2b;
        transform: translateX(2px);
      }
    }
    a.quiz-card.oci { border-left-color: var(--oci); }
    a.quiz-card.gcp { border-left-color: var(--gcp); }
    a.quiz-card.azure { border-left-color: var(--azure); }
    a.quiz-card.aws { border-left-color: var(--aws); }
    a.quiz-card.terraform { border-left-color: var(--terraform); }
    a.quiz-card.cissp { border-left-color: var(--cissp); }
    a.quiz-card.secai { border-left-color: var(--secai); }
    a.quiz-card.redhat { border-left-color: var(--redhat); }
    .quiz-card .name { display: block; font-weight: 600; font-size: 1.05rem; margin-bottom: 0.35rem; }
    .quiz-card .desc { display: block; font-size: 0.9rem; color: var(--text-muted); }
    .quiz-card.completed { opacity: 0.85; }
    .quiz-card .completed-badge { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.35rem; }
    .quiz-card-item { display: flex; align-items: stretch; gap: 0.5rem; }
    .drag-handle {
      flex-shrink: 0; display: flex; align-items: center; padding: 0 0.5rem;
      color: var(--text-muted); cursor: grab; touch-action: none; user-select: none;
      font-size: 1rem; line-height: 1;
    }
    .drag-handle:active { cursor: grabbing; }
    .quiz-card-item .quiz-card { flex: 1; min-width: 0; }
    .quiz-complete-label {
      flex-shrink: 0; display: flex; align-items: center; gap: 0.35rem;
      cursor: pointer; color: var(--text-muted); font-size: 0.85rem; user-select: none;
    }
    .quiz-complete-label:hover { color: var(--text); }
    .quiz-complete-checkbox { cursor: pointer; }
    .quiz-card-item-ghost { opacity: 0.4; }
    .quiz-card-item-drag { opacity: 0.9; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="storage-write-guard.js?v=1"></script>
  <script src="rhcsa-migration.js?v=3"></script>
  <script src="quiz-config.js?v=10"></script>
  <script src="sw-register.js?v=5"></script>
  <script src="brain-dump.js?v=2"></script>
  <script src="motivation.js?v=5"></script>
  <script src="gamification.js?v=3"></script>
  <script src="session-streak.js?v=3"></script>
</head>
<body>
  <header class="site-nav">
    <a href="index.html" class="nav-brand">Study Sessions</a>
    <nav class="nav-links">
      <span id="quiz-nav-links"></span>
      <button type="button" class="nav-dumps-btn" id="review-dumps-btn">Review Dumps</button>
      <button type="button" class="nav-update-btn" id="update-app-btn" aria-describedby="nav-update-help">Update app</button>
      <span id="nav-update-help" class="visually-hidden">Update app keeps your progress and reminders</span>
    </nav>
  </header>
  <div class="container">
    <h1>Study Sessions</h1>
    <p class="subtitle">Choose a practice quiz</p>

    <div id="game-launcher" aria-live="polite"></div>

    <section class="settings-panel" id="settings-panel" aria-labelledby="settings-heading">
      <h2 id="settings-heading" class="settings-heading">Settings</h2>
      <div class="settings-block settings-block-update">
        <p class="settings-help" id="settings-update-help">Update app keeps your progress and reminders</p>
      </div>
      <div class="settings-block settings-block-danger" aria-labelledby="settings-delete-heading">
        <h3 id="settings-delete-heading" class="settings-subheading">Data on this device</h3>
        <p class="settings-help settings-danger-help" id="settings-delete-help">Delete all my data removes everything from this device and the reminder server.</p>
        <button type="button" class="settings-delete-btn" id="delete-all-data-btn" aria-describedby="settings-delete-help">Delete all my data</button>
      </div>
      <p class="settings-status" id="settings-status" role="status" aria-live="polite"></p>
    </section>

    <div id="quiz-list-container"></div>
  </div>
  <script src="quiz-nav.js?v=2"></script>
  <script src="storage-keys.js?v=1"></script>
  <script src="reminder-server.js?v=1"></script>
  <script src="data-export.js?v=1"></script>
  <script src="app-reset.js?v=5"></script>
  <script src="index-init.js?v=6"></script>
</body>
</html>
