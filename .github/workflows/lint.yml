name: Lint Question Banks

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Run bank-wide lint
      run: node scripts/lint-banks.js --ci

    - name: Objectives weight lint fixture (#33)
      run: node scripts/test-objectives-weight-lint.js

    - name: lint-banks per-track window isolation (#36)
      run: node scripts/test-lint-banks-window-isolation.js

    - name: RHCSA migration regression (#41)
      run: node scripts/test-rhcsa-migration.js
    
    - name: Terraform 004 ramp metadata lint
      run: node scripts/lint-terraform-ramp.js --ci
    
    - name: RHCSA10 content quality lint
      run: node scripts/lint-rhcsa10.js --ci
    
    - name: CISSP ramp metadata lint
      run: node scripts/lint-cissp-ramp.js --ci
    
    - name: AWS GenAI ramp metadata lint
      run: node scripts/lint-aws-genai-ramp.js --ci
    
    - name: Check service worker precache
      run: node scripts/check-sw-precache.js

    - name: Service worker update flow (#71)
      run: node scripts/test-sw-update-flow.js

    - name: Storage keys registry (#70)
      run: node scripts/lint-storage-keys.js

    - name: Update app / Delete all my data (#70)
      run: node scripts/test-app-data-lifecycle.js
    
    - name: Check question bank integrity
      run: node scripts/check-page-banks.js
    
    - name: Run CISSP validation
      run: node scripts/validate-cissp-questions.js
    
    - name: Run CISSP smoke tests
      run: node scripts/smoke-test-cissp.js

    - name: Gamification unit tests (#68)
      run: node scripts/test-gamification.js

    - name: Gamification Playwright smoke (#68)
      run: node scripts/playwright-gamification-test.mjs

    - name: Shared quiz smoke tests (#67)
      run: node scripts/smoke-test-quiz.js --all
    
    - name: Run CISSP lint
      run: node scripts/lint-cissp-questions.js
