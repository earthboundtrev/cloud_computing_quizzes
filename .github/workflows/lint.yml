name: Lint Question Banks

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'

    - name: Run bank-wide lint
      run: node scripts/lint-banks.js --ci

    - name: Objectives weight lint fixture (#33)
      run: node scripts/test-objectives-weight-lint.js

    - name: lint-banks per-track window isolation (#36)
      run: node scripts/test-lint-banks-window-isolation.js

    - name: RHCSA migration regression (#41)
      run: node scripts/test-rhcsa-migration.js

    - name: AI-901 track rename migration (#22, #33)
      run: node scripts/test-ai901-migration.js

    - name: RHCSA10 question id migration (#31)
      run: node scripts/test-rhcsa10-id-migration.js

    - name: Terraform 004 ramp metadata lint
      run: node scripts/lint-terraform-ramp.js --ci

    - name: RHCSA10 content quality lint
      run: node scripts/lint-rhcsa10.js --ci

    - name: CISSP ramp metadata lint
      run: node scripts/lint-cissp-ramp.js --ci

    - name: AWS GenAI ramp metadata lint
      run: node scripts/lint-aws-genai-ramp.js --ci

    - name: Check service worker precache
      run: node scripts/check-sw-precache.js

    - name: CACHE_NAME bump when PRECACHE_PATHS changes (#30)
      env:
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: node scripts/check-sw-cache-name-bump.js

    - name: Service worker update flow (#71)
      run: node scripts/test-sw-update-flow.js

    - name: Storage keys registry (#70)
      run: node scripts/lint-storage-keys.js

    - name: Update app / Delete all my data (#70)
      run: node scripts/test-app-data-lifecycle.js

    - name: Progress export / import (#109)
      run: node scripts/test-data-import-export.js

    - name: Capacitor Android guardrails (#111)
      run: node scripts/test-capacitor-native.js

    - name: Install gitleaks 8.24.3 with checksum (#119)
      run: |
        set -euo pipefail
        GITLEAKS_VERSION=8.24.3
        ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        curl -fsSL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
        EXPECTED=$(grep "  ${ARCHIVE}$" /tmp/gitleaks_checksums.txt | awk '{print $1}')
        test -n "$EXPECTED"
        curl -fsSL "${BASE}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
        ACTUAL=$(sha256sum "/tmp/${ARCHIVE}" | awk '{print $1}')
        test "$ACTUAL" = "$EXPECTED"
        tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
        sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version | grep -F "${GITLEAKS_VERSION}"

    - name: Gitleaks config guardrails (#119)
      run: node scripts/test-gitleaks-config.js

    - name: Local reminder schedule (#112)
      run: node scripts/test-reminder-schedule.js

    - name: Entry HTML CSP and no inline handlers (#111)
      run: node scripts/lint-html-entry.js

    - name: Check question bank integrity
      run: node scripts/check-page-banks.js

    - name: Run CISSP validation
      run: node scripts/validate-cissp-questions.js

    - name: Run CISSP smoke tests
      run: node scripts/smoke-test-cissp.js

    - name: Gamification unit tests (#68)
      run: node scripts/test-gamification.js

    - name: Concurrent storage merge (#68, #79)
      run: node scripts/test-concurrent-storage.js

    - name: Install Playwright (browser tests)
      run: |
        npm install --no-save playwright@1.49.1
        npx playwright install --with-deps chromium

    - name: Gamification Playwright smoke (#68)
      run: node scripts/playwright-gamification-test.mjs

    - name: Entry pages console-clean CSP (#111)
      run: node scripts/playwright-console-clean.mjs

    - name: Offline first visit all quiz pages (#30)
      run: node scripts/playwright-offline-first-visit.mjs

    - name: Concurrent quiz tabs Playwright (#68, #79)
      run: |
        CHROME_PATH="$(node -e "import('playwright').then((m)=>console.log(m.chromium.executablePath()))")"
        node scripts/test-concurrent-quiz-tabs.mjs

    - name: Shared quiz smoke tests (#67)
      run: node scripts/smoke-test-quiz.js --all

    - name: Run CISSP lint
      run: node scripts/lint-cissp-questions.js
