name: Android assembleDebug (optional)

on:
  push:
    branches: [ main, cursor/** ]
    paths:
      - 'native/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'native/**'
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install native dependencies and sync www
        working-directory: native
        run: |
          npm ci
          npm run sync:www
          npx cap sync android
      - name: assembleDebug
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcram-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore