name: Android assembleDebug (optional)

on:
  push:
    branches: [ main, cursor/** ]
    paths:
      - 'native/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'native/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install native dependencies and sync www
        working-directory: native
        run: |
          npm ci
          npm run sync:www
          npx cap sync android
      - name: assembleDebug
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudcram-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore